version: "3.8"

services:
  backend:
    image: enaccess/micropowermanager-backend:latest
    env_file:
      - .env.backend
    ports:
      - "8000:80"
      - "8443:443"
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    healthcheck:
      test: [CMD, curl, -f, http://localhost/up]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: enaccess/micropowermanager-frontend:latest
    env_file:
      - .env.frontend
    ports:
      - "8001:80"
    depends_on:
      - backend
    restart: unless-stopped

  scheduler:
    image: enaccess/micropowermanager-scheduler:latest
    env_file:
      - .env.backend
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage

  worker:
    image: enaccess/micropowermanager-queue-worker:latest
    env_file:
      - .env.backend
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage

  mysql:
    image: mysql:8.4
    env_file:
      - .env.mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  storage_data:
